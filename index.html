<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <title>Мапа Львова на Leaflet</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw/dist/leaflet.draw.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-toolbar@0.4.0-alpha.2/dist/leaflet.toolbar.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-distortableimage@0.20.7/dist/leaflet.distortableimage.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.polylinemeasure@2.4.0/Leaflet.PolylineMeasure.min.css" />
</head>
<body>
  <div id="geosearch-bar">
    <input type="text" id="geosearch-input" placeholder="Пошук по геоназвах..." autocomplete="off" />
    <div id="geosearch-autocomplete" class="autocomplete-list"></div>
  </div>
  <!-- <div id="theme-toggle">
    <button id="light-theme">Світла</button>
    <button id="dark-theme">Темна</button>
  </div> -->
  <div id="layers-panel-drawer">
    <button id="layers-panel-toggle" class="toggle-panel-btn" title="Сховати панель шарів"><span class="material-icons">chevron_left</span></button>
    <div id="layers-panel">
      <div class="layers-panel-header">
        <span class="layers-panel-title">Шари</span>
        <span class="layers-panel-actions">
          <button class="layers-panel-btn" id="export-all" title="Експортувати всі шари"><i class="fa fa-upload"></i></button>
          <input type="file" id="import-all-input" accept=".json,.geojson,.kmz" style="display:none">
          <button class="layers-panel-btn" id="import-all" title="Імпортувати шари"><i class="fa fa-download"></i></button>
          <button class="layers-panel-btn" id="add-layer" title="Новий шар"><i class="fa fa-plus"></i></button>
        </span>
      </div>
      <!-- Глобальний пошук по об'єктах -->
      <div id="global-object-search-wrap">
        <input type="text" id="global-object-search" placeholder="Пошук об'єктів ...">
        <div id="global-object-search-results"></div>
      </div>
      <div id="layer-controls"></div>
    </div>
  </div>
  <div id="map"></div>
  
  <!-- Модальне вікно для редагування об'єктів -->
  <div id="edit-object-modal" class="modal hidden">
    <div class="modal-content modal-content-narrow">
      <div class="modal-header">
        <h3 id="modal-title">Редактор лінії</h3>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="object-name">Назва</label>
          <input type="text" id="object-name" placeholder="Назва">
        </div>
        <div class="form-group">
          <label for="object-description">Опис (можна використовувати HTML)</label>
          <textarea id="object-description" placeholder="Опис" rows="3"></textarea>
        </div>
        <div class="form-group marker-coords-group" style="display:none;">
          <label>Координати</label>
          <div style="display: flex; gap: 8px;">
            <input type="number" id="marker-lat" step="any" placeholder="Широта" style="flex:1;" />
            <input type="number" id="marker-lng" step="any" placeholder="Довгота" style="flex:1;" />
          </div>
        </div>
        <div class="form-group" id="object-image-group">
          <label for="object-image">Зображення</label>
          <input type="file" id="object-image" accept="image/*">
          <div id="object-image-preview-container" class="image-preview-container hidden">
            <img id="object-image-preview" class="image-preview" src="" alt="preview" />
            <button type="button" id="object-image-remove" class="btn-secondary" style="margin-left:8px;">Видалити зображення</button>
          </div>
        </div>
        <div class="form-group" id="color-picker-group" class="hidden">
          <label>Колір</label>
          <div class="color-palette" id="color-palette">
            <div class="color-swatch" data-color="#ff4500" style="background-color:#ff4500;"></div>
            <div class="color-swatch" data-color="#ff8c00" style="background-color:#ff8c00;"></div>
            <div class="color-swatch" data-color="#ffd700" style="background-color:#ffd700;"></div>
            <div class="color-swatch" data-color="#90ee90" style="background-color:#90ee90;"></div>
            <div class="color-swatch" data-color="#00bcd4" style="background-color:#00bcd4;"></div>
            <div class="color-swatch" data-color="#2196f3" style="background-color:#2196f3;"></div>
            <div class="color-swatch" data-color="#e91e63" style="background-color:#e91e63;"></div>
            <div class="color-swatch" data-color="#212121" style="background-color:#212121;"></div>
            <input type="color" id="object-color" class="color-picker-input" value="#1976d2">
          </div>
        </div>
        <div class="form-group" id="line-width-group" class="hidden">
          <label for="line-width">Товщина: <span id="line-width-value">3px</span></label>
          <input type="range" id="line-width" min="1" max="10" value="3">
        </div>
        <div class="form-group" id="style-group" class="hidden">
          <label for="line-style">Стиль</label>
          <select id="line-style">
            <option value="solid">Суцільна</option>
            <option value="dashed">Пунктирна</option>
            <option value="dotted">Точкова</option>
          </select>
        </div>
        <div class="form-group" id="opacity-group" class="hidden">
          <label for="object-opacity">Прозорість: <span id="opacity-value">100%</span></label>
          <input type="range" id="object-opacity" min="0" max="1" step="0.1" value="1">
        </div>
        <div class="form-group" id="marker-icon-group" class="hidden position-relative">
          <label for="marker-icon">Назва іконки (Material Icons)</label>
          <div class="marker-icon-input-wrap">
            <input type="text" id="marker-icon" placeholder="напр. home, star..." autocomplete="off" />
            <span id="marker-icon-preview" class="material-icons">place</span>
          </div>
          <div id="marker-icon-autocomplete" class="autocomplete-list"></div>
        </div>
      </div>
      <div class="modal-footer modal-footer-flex">
        <button id="save-object" class="btn-primary">Оновити</button>
        <button id="delete-object" class="btn-danger">Видалити</button>
        <button id="cancel-edit" class="btn-secondary">Закрити</button>
      </div>
    </div>
  </div>
  <div id="confirm-modal" class="modal hidden">
    <div class="modal-content modal-content-narrow">
      <div class="modal-header">
        <h3 id="confirm-modal-title">Підтвердження</h3>
      </div>
      <div class="modal-body">
        <div id="confirm-modal-message">Ви дійсно хочете видалити?</div>
      </div>
      <div class="modal-footer modal-footer-flex">
        <!-- кнопки додаються динамічно через showConfirmDialog -->
      </div>
    </div>
  </div>
  <div id="confirm-modal-backdrop" class="modal-backdrop hidden"></div>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    window.L = window.L || {};
    window.L.drawLocal = {
      draw: {
        toolbar: {
          actions: {
            title: 'Скасувати малювання',
            text: 'Скасувати'
          },
          finish: {
            title: 'Завершити малювання',
            text: 'Завершити'
          },
          undo: {
            title: 'Видалити останню точку',
            text: 'Видалити останню точку'
          },
          buttons: {
            polyline: 'Намалювати лінію',
            polygon: 'Намалювати полігон',
            rectangle: 'Намалювати прямокутник',
            circle: 'Намалювати коло',
            marker: 'Додати маркер',
            circlemarker: 'Додати круглий маркер'
          }
        },
        handlers: {
          polygon: {
            tooltip: {
              start: 'Клікніть для початку малювання полігону.',
              cont: 'Клікніть для продовження малювання полігону.',
              end: 'Клікніть на першу точку для завершення полігону.'
            },
            error: '<strong>Помилка:</strong> полігон не може сам себе перетинати!'
          },
          polyline: {
            tooltip: {
              start: 'Клікніть для початку малювання лінії.',
              cont: 'Клікніть для продовження малювання лінії.',
              end: 'Клікніть на останню точку для завершення лінії.'
            },
            error: '<strong>Помилка:</strong> лінії не можуть перетинатися!'
          },
          rectangle: {
            tooltip: {
              start: 'Клікніть і тягніть для малювання прямокутника.'
            },
            error: ''
          },
          circle: {
            tooltip: {
              start: 'Клікніть і тягніть для малювання кола.'
            },
            error: ''
          },
          marker: {
            tooltip: {
              start: 'Клікніть для додавання маркера.'
            },
            error: ''
          },
          circlemarker: {
            tooltip: {
              start: 'Клікніть для додавання круглого маркера.'
            },
            error: ''
          }
        }
      },
      edit: {
        toolbar: {
          actions: {
            save: {
              title: 'Зберегти зміни',
              text: 'Зберегти'
            },
            cancel: {
              title: 'Скасувати редагування',
              text: 'Скасувати'
            }
          },
          buttons: {
            edit: 'Редагувати шари',
            editDisabled: 'Немає шарів для редагування',
            remove: 'Видалити шари',
            removeDisabled: 'Немає шарів для видалення'
          }
        },
        handlers: {
          edit: {
            tooltip: {
              text: 'Перетягніть маркери для редагування обʼєкта.',
              subtext: ''
            }
          },
          remove: {
            tooltip: {
              text: 'Клікніть на обʼєкт для видалення.',
              subtext: ''
            }
          }
        }
      }
    };
  </script>
  <script src="https://unpkg.com/leaflet-draw/dist/leaflet.draw.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet-toolbar@0.4.0-alpha.2/dist/leaflet.toolbar.min.js"></script>  
  <script src="./leaflet.distortableimage.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <!-- Додаємо бібліотеки для KMZ імпорту -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://unpkg.com/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet.polylinemeasure@2.4.0/Leaflet.PolylineMeasure.min.js"></script>
  
  <!-- Дебагінг скрипти -->
  <script src="./debug-overlay.js"></script>
  <script src="./overlay-position-fix.js"></script>
  <script src="./drag-save-fix.js"></script>
  <script src="./quick-debug.js"></script>
  <script src="./detailed-debug.js"></script>
  
  <script type="module" src="./dist/main.js"></script>
  
  <!-- Автоматичний запуск дебагінг функцій -->
  <script>
    // Запускаємо дебагінг після завантаження сторінки
    window.addEventListener('load', function() {
      console.log('🚀 Автоматичний запуск дебагінг функцій...');
      
      // Запускаємо швидку діагностику
      if (typeof quickDebug === 'function') {
        setTimeout(quickDebug, 1000);
      }
      
      // Увімкнути debug режим для overlay позицій
      if (window.overlayPositionFix && typeof window.overlayPositionFix.enableDebug === 'function') {
        setTimeout(() => window.overlayPositionFix.enableDebug(), 1500);
      }
      
      // Увімкнути debug режим для drag save
      if (window.dragSaveFix && typeof window.dragSaveFix.enableDebug === 'function') {
        setTimeout(() => window.dragSaveFix.enableDebug(), 2000);
      }
      
      // Запустити детальний моніторинг edit подій
      if (typeof setupDetailedEditMonitoring === 'function') {
        setTimeout(setupDetailedEditMonitoring, 2500);
      }
      
      console.log('✅ Дебагінг функції активовані!');
      console.log('💡 Доступні команди:');
      console.log('   - quickDebug() - швидка діагностика');
      console.log('   - debugOverlay.full() - повний аналіз');
      console.log('   - debugOverlay.analyzeCircleIssue() - аналіз проблеми з колами');
      console.log('   - debugOverlay.analyzePolygonIssue() - аналіз проблеми з полігонами');
      console.log('   - overlayPositionFix.checkState() - стан overlay позицій');
      console.log('   - dragSaveFix.test() - тест drag збереження');
    });
  </script>
</body>
</html>
